global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'savestatereborn'
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SaveStateReborn application metrics
  - job_name: 'savestatereborn'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'savestatereborn'
          environment: 'production'
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 3s
    honor_labels: true
    
  # Alternative: If running in Docker network
  - job_name: 'savestatereborn-docker'
    static_configs:
      - targets: ['savestatereborn:8080']
        labels:
          service: 'savestatereborn'
          environment: 'docker'
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 3s
    honor_labels: true

  # Node exporter for system metrics (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Windows exporter for Windows hosts
  - job_name: 'windows-exporter'
    static_configs:
      - targets: ['host.docker.internal:9182']
    scrape_interval: 15s
