name: Continuous Integration
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Guard continuation-based .Result usage
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          pattern = re.compile(r"ContinueWith\s*\([^)]*=>[\s\S]*?\.Result\b", re.MULTILINE)
          violations = []

          for path in pathlib.Path("src").rglob("*.cs"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              for match in pattern.finditer(text):
                  line = text.count("\n", 0, match.start()) + 1
                  snippet = match.group(0).splitlines()[0].strip()
                  violations.append((path.as_posix(), line, snippet))

          if violations:
              print("Found continuation-based .Result patterns:")
              for file_path, line, snippet in violations:
                  print(f"{file_path}:{line}: {snippet}")
              sys.exit(1)

          print("No continuation-based .Result patterns found in src.")
          PY

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage --filter "Category!=IntegrationTest"

      - name: Run integration tests
        run: dotnet test --no-build --configuration Release --filter "Category=IntegrationTest"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/**/coverage.cobertura.xml
          fail_ci_if_error: true
          threshold: 95%

      - name: Complexity check
        run: |
          echo "Checking file complexity..."
          find src -name "*.cs" -exec wc -l {} \; | awk '$1 > 200 {print "ERROR: " $2 " has " $1 " lines"; exit 1}'

      - name: Security scan
        uses: github/super-linter@v6
        env:
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CSHARP: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  performance-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run performance benchmarks
        run: dotnet run --project tools/SaveState.Benchmarks --configuration Release

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/
