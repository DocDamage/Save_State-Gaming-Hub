name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.props'
  push:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  # Job 1: Build Verification
  build:
    name: Build (0 Warnings)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore SaveStateReborn.Core.sln
      
      - name: Build (Treat Warnings as Errors)
        run: dotnet build SaveStateReborn.Core.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --warnaserror

  # Job 2: Architecture Tests
  architecture-tests:
    name: Architecture Tests
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore SaveStateReborn.Core.sln
      
      - name: Build
        run: dotnet build SaveStateReborn.Core.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
      - name: Run Architecture Tests
        run: dotnet test tests/SaveState.Infrastructure.Tests --no-build --filter "FullyQualifiedName~ArchitectureTests" --verbosity normal

  # Job 3: Code Quality Tests
  code-quality-tests:
    name: Code Quality Tests
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore SaveStateReborn.Core.sln
      
      - name: Build
        run: dotnet build SaveStateReborn.Core.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
      - name: Run Code Quality Tests
        run: dotnet test tests/SaveState.Infrastructure.Tests --no-build --filter "FullyQualifiedName~CodeQualityTests" --verbosity normal

  # Job 4: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    needs: build
    strategy:
      matrix:
        test-project:
          - SaveState.Core.Tests
          - SaveState.Application.Tests
          - SaveState.Infrastructure.Tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore SaveStateReborn.Core.sln
      
      - name: Build
        run: dotnet build SaveStateReborn.Core.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
      - name: Run Tests
        run: dotnet test tests/${{ matrix.test-project }} --no-build --verbosity normal

  # Job 5: Code Coverage
  code-coverage:
    name: Code Coverage (80% Threshold)
    runs-on: windows-latest
    needs: [architecture-tests, code-quality-tests, unit-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore SaveStateReborn.Core.sln
      
      - name: Build
        run: dotnet build SaveStateReborn.Core.sln --configuration Debug --no-restore
      
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
      - name: Run Tests with Coverage
        run: dotnet test SaveStateReborn.Core.sln --collect:"XPlat Code Coverage" --results-directory ./coverage
      
      - name: Generate Report
        run: reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage-report" -reporttypes:Html
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report
      
      - name: Check Coverage Threshold
        run: |
          # Extract coverage percentage and check against threshold
          $coverage = [xml](Get-Content "./coverage/**/coverage.cobertura.xml")
          $lineRate = [double]$coverage.coverage.line-rate * 100
          Write-Host "Code Coverage: $lineRate%"
          if ($lineRate -lt 80) {
            Write-Error "Code coverage $lineRate% is below threshold of 80%"
            exit 1
          }

  # Job 6: Dependency Vulnerability Scan
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore SaveStateReborn.Core.sln
      
      - name: Check for Vulnerable Packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | Tee-Object -FilePath vulnerable.txt
          if (Select-String -Path vulnerable.txt -Pattern "has the following vulnerable packages") {
            Write-Error "Vulnerable packages found!"
            exit 1
          }

  # Job 7: Linting (EditorConfig)
  linting:
    name: EditorConfig Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install EditorConfig Checker
        run: npm install -g editorconfig-checker
      
      - name: Check EditorConfig
        run: editorconfig-checker

  # Final Status
  quality-gates-passed:
    name: All Quality Gates Passed
    runs-on: ubuntu-latest
    needs: [build, architecture-tests, code-quality-tests, unit-tests, code-coverage, vulnerability-scan, linting]
    if: always()
    steps:
      - name: Check All Jobs Status
        run: |
          if ("${{ needs.build.result }}" -ne "success" -or "${{ needs.architecture-tests.result }}" -ne "success" -or "${{ needs.code-quality-tests.result }}" -ne "success" -or "${{ needs.unit-tests.result }}" -ne "success" -or "${{ needs.code-coverage.result }}" -ne "success" -or "${{ needs.vulnerability-scan.result }}" -ne "success" -or "${{ needs.linting.result }}" -ne "success") {
            Write-Error "One or more quality gates failed"
            exit 1
          }
          Write-Host "✅ All quality gates passed!"
